services:
  agent-app:
    build: .
    environment:
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
    ports: 
      - "8080:8080"
    depends_on:
      - chromadb
      - phoenix
    networks:
      - agent-network

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - agent-network
  seed:
    build: .
    command: ["python3", "seed.py"]
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    depends_on:
      - chromadb
    networks:
      - agent-network
    profiles:
      - seed
  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"
    networks:
      - agent-network

volumes:
  chroma_data:

networks:
  agent-network:
