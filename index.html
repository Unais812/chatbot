<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent</title>
<style>
  :root {
    --accent: #b8a6f0;
    --accent-deep: #8f7ae0;
    --ink: #3a3350;
    --ink-soft: #6b6485;
    --line: rgba(143, 122, 224, 0.18);
    --user-grad: linear-gradient(135deg, rgba(203,166,247,0.28), rgba(160,196,247,0.22));
    --bot-grad: linear-gradient(135deg, rgba(255,255,255,0.72), rgba(245,240,255,0.6));
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1100px 700px at 15% -10%, rgba(203,166,247,0.35), transparent 60%),
      radial-gradient(900px 600px at 110% 10%, rgba(160,196,247,0.28), transparent 55%),
      radial-gradient(800px 800px at 50% 120%, rgba(214,201,248,0.4), transparent 60%),
      linear-gradient(180deg, #faf8ff, #f3eefc);
    display: flex;
    justify-content: center;
    align-items: stretch;
  }

  .shell {
    width: 100%;
    max-width: 760px;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    padding: 20px 16px;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 6px 6px 16px;
  }

  .mark {
    width: 34px;
    height: 34px;
    border-radius: 11px;
    background: linear-gradient(135deg, var(--accent), var(--accent-deep));
    box-shadow: 0 6px 18px rgba(143,122,224,0.35);
    position: relative;
    flex: none;
  }
  .mark::after {
    content: "";
    position: absolute;
    inset: 9px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.85);
    border-top-color: transparent;
  }

  header h1 {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.2px;
    margin: 0;
  }
  header p {
    margin: 2px 0 0;
    font-size: 12px;
    color: var(--ink-soft);
  }

  .stream {
    flex: 1;
    overflow-y: auto;
    padding: 8px 4px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
  }

  .row { display: flex; }
  .row.me { justify-content: flex-end; }

  .bubble {
    max-width: 78%;
    padding: 12px 15px;
    font-size: 14.5px;
    line-height: 1.5;
    border-radius: 18px;
    border: 1px solid var(--line);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    white-space: pre-wrap;
    word-wrap: break-word;
    box-shadow: 0 8px 24px rgba(120,100,190,0.08);
    animation: rise 0.32s cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .row.me .bubble {
    background: var(--user-grad);
    border-bottom-right-radius: 6px;
    color: var(--ink);
  }
  .row.bot .bubble {
    background: var(--bot-grad);
    border-bottom-left-radius: 6px;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .typing { display: flex; gap: 5px; padding: 4px 2px; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent-deep);
    opacity: 0.5;
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.18s; }
  .typing span:nth-child(3) { animation-delay: 0.36s; }
  @keyframes blink {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.35; }
    40% { transform: translateY(-4px); opacity: 0.9; }
  }

  .composer {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 10px;
    border-radius: 20px;
    border: 1px solid var(--line);
    background: linear-gradient(135deg, rgba(255,255,255,0.7), rgba(244,238,255,0.55));
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 10px 30px rgba(120,100,190,0.1);
  }

  textarea {
    flex: 1;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    font: inherit;
    color: var(--ink);
    max-height: 140px;
    line-height: 1.5;
    padding: 6px 8px;
  }
  textarea::placeholder { color: var(--ink-soft); }

  .send {
    flex: none;
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 13px;
    cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent-deep));
    box-shadow: 0 6px 16px rgba(143,122,224,0.4);
    display: grid;
    place-items: center;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .send:hover { transform: translateY(-1px); }
  .send:disabled { opacity: 0.45; cursor: default; transform: none; }
  .send svg { width: 18px; height: 18px; stroke: white; }

  @media (prefers-reduced-motion: reduce) {
    .bubble, .typing span, .send { animation: none; transition: none; }
  }
</style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="mark"></div>
      <div>
        <h1>Agent</h1>
        <p>Knowledge base and web search</p>
      </div>
    </header>

    <div class="stream" id="stream">
      <div class="row bot">
        <div class="bubble">Ask me something. I can search the internal knowledge base or the web.</div>
      </div>
    </div>

    <div class="composer">
      <textarea id="input" rows="1" placeholder="Message the agent" autocomplete="off"></textarea>
      <button class="send" id="send" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M13 6l6 6-6 6" />
        </svg>
      </button>
    </div>
  </div>

<script>
  const stream = document.getElementById("stream");
  const input = document.getElementById("input");
  const send = document.getElementById("send");

  function addBubble(text, who) {
    const row = document.createElement("div");
    row.className = "row " + who;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    row.appendChild(bubble);
    stream.appendChild(row);
    stream.scrollTop = stream.scrollHeight;
    return bubble;
  }

  function addTyping() {
    const row = document.createElement("div");
    row.className = "row bot";
    row.innerHTML = '<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
    stream.appendChild(row);
    stream.scrollTop = stream.scrollHeight;
    return row;
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    addBubble(text, "me");
    input.value = "";
    input.style.height = "auto";
    send.disabled = true;

    const typing = addTyping();

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text }),
      });
      const data = await res.json();
      typing.remove();
      addBubble(data.reply || "No response.", "bot");
    } catch (err) {
      typing.remove();
      addBubble("Could not reach the agent. Check that the service is running.", "bot");
    } finally {
      send.disabled = false;
      input.focus();
    }
  }

  send.addEventListener("click", sendMessage);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
  });
</script>
</body>
</html>
